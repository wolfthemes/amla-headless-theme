name: Deploy theme to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet aussi de lancer le déploiement manuellement depuis GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: 22
          # Dossier local contenant le thème (à adapter selon votre repo)
          local_path: './*'
          # Chemin distant vers le dossier du thème sur IONOS
          remote_path: '${{ secrets.IONOS_PATH }}/wp-content/themes/amla-headless-theme'
          # Optionnel : exclure des fichiers/dossiers inutiles
          # sftpArgs: '-o ConnectTimeout=5'
