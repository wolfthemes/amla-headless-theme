name: Deploy to staging

on:
  push:
    branches:
      - stage

jobs:
  deploy-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_STAGE }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT_STAGE }} ${{ secrets.SSH_HOST_STAGE }} >> ~/.ssh/known_hosts

      - name: Deploy via git pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_STAGE }}
          username: ${{ secrets.SSH_USER_STAGE }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGE }}
          port: ${{ secrets.SSH_PORT_STAGE }}
          envs: SSH_PATH,THEME_NAME
          script: |
            set -e
            cd "$SSH_PATH/wp-content/themes/$THEME_NAME"
            git status --porcelain
            git pull origin stage
            git rev-parse HEAD
            cd "$SSH_PATH"
            wp cache flush
        env:
          SSH_PATH: ${{ secrets.SSH_PATH_STAGE }}
          THEME_NAME: ${{ github.event.repository.name }}
